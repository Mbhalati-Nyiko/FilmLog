<div class="login-container" id="login-container" #loginContainer
[class.sign-up-mode]="isSignUpMode"
>
  <div class="box">
    <div class="inner-box">
      <div class="forms-wrap">
        <form action="" class="sign-in-form" autocomplete="off">

          <div class="logo">
            <img [src]="myImagePath" alt="logo" class="logo" />
            <h3>FilmLog</h3>
          </div>

          <div class="heading">
            <h2>Track your movie journey</h2>
            <h6>Not registered yet?</h6>
            <a href="#" class="toggle" #toggle
            (click)="toggleForm()"> Sign Up</a>
          </div>

          <div class="actual-form">
            <div class="input-wrap">
                <ion-input
                  class="input-field"
                  fill="clear"
                  color="light"
                  label="Name"
                  label-placement="floating"
                  type="text"
                  minlength="3"
                  autocomplete="off">
                </ion-input>
            </div>
          </div>

          <div class="actual-form">
            <div class="input-wrap">
                <ion-input
                  fill="clear"
                  color="light"
                  class="input-field"
                  label="Password"
                  label-placement="floating"
                  type="password"
                  minlength="4"
                  autocomplete="off">
                </ion-input>
            </div>
          </div>

          <input type="submit" value="Sign In" class="sign-btn">

          <div class="text">
            <p>Forgotten your password or your login details? <a href="">Get help</a> signing in.</p>
          </div>

        </form>

        <form action="" class="sign-up-form" autocomplete="off">

          <div class="logo">
             <img [src]="myImagePath" alt="logo" class="logo" />
            <h3>FilmLog</h3>
          </div>

          <div class="heading">
            <h2>Get Started</h2>
            <h6>Already have an account?</h6>
            <a href="#" class="toggle" #toggle
            (click)="toggleForm()"> Sign In</a>
          </div>

          
          <div class="actual-form">
            <div class="input-wrap">
              <ion-input
              class="input-field"
              fill="clear"
              color="light"
              label="Name"
              label-placement="floating"
              type="text"
              minlength="3"
              autocomplete="off">
            </ion-input>
          </div>
        </div>
        
        <div class="actual-form">
          <div class="input-wrap">
              <ion-input
                class="input-field"
                fill="clear"
                color="light"
                label="Email"
                label-placement="floating"
                errorText="Invalid email"
                type="email"
                minlength="3"
                autocomplete="off">
              </ion-input>
          </div>
        </div>

        <div class="actual-form">
          <div class="input-wrap">
                <ion-input
                  fill="clear"
                  color="light"
                  class="input-field"
                  label="Password"
                  label-placement="floating"
                  type="password"
                  minlength="4"
                  autocomplete="off">
                </ion-input>
            </div>
          </div>

          <input type="submit" value="Sign Up" class="sign-btn" id="toggle">

          <div class="text">
            <p>By signing up, you agree to our <a href="">Terms & Conditions</a> and <a href="">Privacy Policy</a>.</p>
          </div>

        </form>
      </div>
      <div class="carousel"></div>
    </div>
  </div>
</div>
