<!-- login.page.html -->
<div class="login-container" [class.sign-up-mode]="isSignUpMode">
  <div class="box">
    <div class="inner-box">

      <!-- Forms Wrap -->
      <div class="forms-wrap">

        <!-- Sign In Form -->
        <form class="sign-in-form" (ngSubmit)="onLogin()">
          <div class="logo">
            <img [src]="myImagePath" alt="FilmLog">
            <h4>FilmLog</h4>
          </div>

          <div class="heading">
            <h2>Welcome Back</h2>
            <h6>Not registered yet? </h6>
            <a href="#" class="toggle" (click)="toggleForm(); $event.preventDefault()">Sign up</a>
          </div>

          <div class="actual-form">
            <div class="input-wrap">
              <ion-input
                color="light"

                label="Username"
                labelPlacement="floating"
                type="text"
                class="input-field"
                [(ngModel)]="logInObj.username"
                name="login-username"
                required
                autocomplete="off">
              </ion-input>
            </div>

            <div class="input-wrap">
              <ion-input
                color="light"

                label="Password"
                labelPlacement="floating"
                type="password"
                class="input-field"
                [(ngModel)]="logInObj.password"
                name="login-password"
                required>
              </ion-input>
            </div>
          </div>

            <button type="submit" class="sign-btn">Sign In</button>

            <p class="text">
              <a href="#" (click)="$event.preventDefault()">Forgot password?</a>
            </p>
        </form>

        <!-- Sign Up Form -->
        <form class="sign-up-form" (ngSubmit)="onRegister()">
          <div class="logo">
            <img [src]="myImagePath" alt="FilmLog">
            <h4>FilmLog</h4>
          </div>

          <div class="heading">
            <h2>Get Started</h2>
            <h6>Already have an account? </h6>
            <a href="#" class="toggle" (click)="toggleForm(); $event.preventDefault()">Sign in</a>
          </div>

          <div class="actual-form">
            <div class="input-wrap">
              <ion-input
                color="light"

                label="Username"
                labelPlacement="floating"
                type="text"
                class="input-field"
                [(ngModel)]="signUpObj.username"
                name="signup-username"
                required
                autocomplete="off">
              </ion-input>
            </div>

            <div class="input-wrap">
              <ion-input
                color="light"
                label="Email"
                labelPlacement="floating"
                type="email"
                class="input-field"
                [(ngModel)]="signUpObj.email"
                name="signup-email"
                required
                autocomplete="off">
              </ion-input>
            </div>

            <div class="input-wrap">
              <ion-input
                color="light"

                label="Password"
                labelPlacement="floating"
                type="password"
                class="input-field"
                [(ngModel)]="signUpObj.password"
                name="signup-password"
                required>
              </ion-input>
            </div>
          </div>

          <button type="submit" class="sign-btn">Sign Up</button>

          <p class="text">
            By signing up, you agree to our
            <a href="#" (click)="$event.preventDefault()">Terms & Conditions</a>
          </p>

        </form>
      </div>


      <!-- Carousel Section -->
      <div class="carousel">
        <!-- Add carousel content here if needed -->
      </div>

    </div>
  </div>
</div>
