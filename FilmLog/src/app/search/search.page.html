<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Search Movies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Search Movies</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="search-container">

    <div class="search-box">
      <form (ngSubmit)="onSearch()">
        <ion-item>
          <ion-searchbar
            animated="true"
            placeholder="Search for movies, TV shows..."
            [(ngModel)]="searchQuery"
            name="searchQuery"
            (ionClear)="clearSearch()">
          </ion-searchbar>
        </ion-item>
        <ion-button
          expand="block"
          color="dark"
          (click)="onSearch()"
          [disabled]="isLoading || !searchQuery.trim()">
          {{ isLoading ? 'Searching...' : 'Search' }}
        </ion-button>
      </form>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="loading-container">
      <!-- <ion-spinner name="crescent"></ion-spinner>
      <p>Searching for movies...</p> -->
      <app-loader></app-loader>
    </div>

    <!-- Error Message -->
    <ion-text *ngIf="errorMessage && !isLoading" color="danger">
      <p class="error-message">{{ errorMessage }}</p>
    </ion-text>

    <!-- Search Results - Grid Layout (2 columns) -->
    <div *ngIf="!isLoading && searchResults.length > 0" class="search-results">
      <ion-grid class="results-grid">

        <ion-row>
          <ion-col size="6" *ngFor="let result of searchResults">
            <ion-card class="result-card">

              <div class="card-content">

                <div class="poster-container">
                  <ion-img
                    [src]="result.image"
                    [alt]="result.title"
                    (ionError)="result.image = 'assets/default-poster.jpg'">
                  </ion-img>
                </div>

                <div class="movie-info">

                  <ion-card-header>
                    <ion-card-title>{{ result.title }}</ion-card-title>
                    <ion-card-subtitle>Year: {{ result.year }}</ion-card-subtitle>
                  </ion-card-header>

                  <ion-card-content>

                    <!-- Safe description with length check -->
                    <p>{{ getShortDescription(result.description) }}</p>


                    <ion-button
                      fill="clear"
                      size="small"
                      (click)="viewMovieDetails(result)">
                      View Details
                    </ion-button>

                  </ion-card-content>

                </div>
              </div>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>

    <!-- No Results Message -->
    <div *ngIf="!isLoading && !errorMessage && searchResults.length === 0 && searchQuery"
         class="no-results">
      <ion-text color="medium">
        <p>No results found for "{{ searchQuery }}"</p>
      </ion-text>
    </div>

  </div>
</ion-content>
