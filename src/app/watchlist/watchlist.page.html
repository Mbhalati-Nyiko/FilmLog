<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Watchlist</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Watchlist</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Empty State -->
  <div *ngIf="!isLoading && watchlist.length === 0" class="empty-state">
    <ion-icon name="bookmark-outline" class="empty-icon"></ion-icon>
    <h3>Your watchlist is empty</h3>
    <p>Start adding movies you want to watch later!</p>
    <ion-button (click)="goToSearch()" fill="outline">
      <ion-icon name="search-outline" slot="start"></ion-icon>
      Browse Movies
    </ion-button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading your watchlist...</p>
  </div>

  <!-- Watchlist Items -->
  <div *ngIf="!isLoading && watchlist.length > 0" class="watchlist-container">
    <div class="watchlist-item" *ngFor="let movie of watchlist">

      <div>
        <div class="item-poster" (click)="viewMovieDetails(movie)">
          <ion-img
            [src]="movie.image"
            [alt]="movie.title"
            (ionError)="movie.image = 'assets/default-poster.jpg'">
          </ion-img>
        </div>
      </div>

      <div class="item-content">
        <div class="movie-info" (click)="viewMovieDetails(movie)">
          <h2>{{ movie.title }}</h2>
          <p class="movie-year">{{ movie.year }}</p>
          <p class="movie-cast">{{ getShortDescription(movie.cast) }}</p>
        </div>

        <div class="button-area">
          <ion-button fill="clear" color="dark" (click)="viewMovieDetails(movie)">
            Details
          </ion-button>
          <ion-button fill="solid" size="small" color="light" (click)="moveToWatched(movie)">
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
            Watched
          </ion-button>
        </div>
      </div>

        <ion-button
          fill="clear"
          color="danger"
          (click)="removeFromWatchlist(movie, $event)"
          class="remove-btn">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      <div>

      </div>
    </div>

    <!-- Clear All Button -->
    <div class="clear-all-container" *ngIf="watchlist.length > 0">
      <ion-button
        expand="block"
        fill="clear"
        color="danger"
        (click)="clearAllWatchlist()">
        <ion-icon name="trash-outline" slot="start"></ion-icon>
        Clear All Watchlist
      </ion-button>
    </div>
  </div>
</ion-content>

<div class="tabs-group">
  <ion-tab-bar slot="bottom">
    <ion-tab-button (click)="goToSearch()">
      <ion-icon name="search-outline"></ion-icon>
      <ion-label>Search</ion-label>
    </ion-tab-button>
    <ion-tab-button class="active-tab" (click)="goToWatchlist()">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Watchlist</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="goToWatched()">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <ion-label>Watched</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="goToStats()">
      <ion-icon name="stats-chart-outline"></ion-icon>
      <ion-label>Statistics</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="logOut()">
      <ion-icon name="log-out-outline"></ion-icon>
      <ion-label>Logout</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</div>
